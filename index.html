<title>랜덤 챔피언 뽑기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 헥스테크 금속 프레임 안에 중앙 카드 하나. 위에 직업 필터, 아래에 최근 뽑은 기록. */
:root {
  --bg: #050b14;
  --panel: #0b1626;
  --panel-2: #101f34;
  --line: #3a3322;
  --gold: #c8aa6e;
  --gold-hi: #f0e6d2;
  --cyan: #0ac8b9;
  --text: #d6dde8;
  --muted: #8794a8;
  --display: "Cinzel", "Times New Roman", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background:
    radial-gradient(900px 500px at 50% -10%, #12335a55, transparent 70%),
    radial-gradient(600px 400px at 90% 110%, #0ac8b922, transparent 70%),
    var(--bg);
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--body);
  min-height: 100%;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--display); letter-spacing: .28em; font-size: 11px; color: var(--cyan); text-transform: uppercase; }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 7vw, 36px); letter-spacing: .06em; color: var(--gold-hi); text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  font: 500 13px var(--body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); padding: 6px 12px; cursor: pointer;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  min-height: 32px;
}
.chip:hover { color: var(--gold-hi); border-color: var(--gold); }
.chip[aria-pressed="true"] { color: #1a1408; background: var(--gold); border-color: var(--gold); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.card {
  position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--gold); padding: 26px 20px 22px;
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line), 0 20px 60px #0009;
}
.card::before, .card::after {
  content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--gold);
}
.card::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.card::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

.crest { width: min(240px, 62vw); aspect-ratio: 1; }
.crest svg { width: 100%; height: 100%; display: block; }
.crest.wide { width: 100%; aspect-ratio: 1215 / 717; }
.crest.wide img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; border: 1px solid var(--gold); background: var(--panel); }
.crest.spin svg { animation: flick .12s steps(2) infinite; }
@keyframes flick { 50% { filter: brightness(1.5) saturate(1.3); } }
.crest.pop svg, .crest.pop img { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.7) rotate(-6deg); opacity: .3; } to { transform: none; opacity: 1; } }

.name { margin: 0; font-size: clamp(30px, 9vw, 44px); font-weight: 700; color: var(--gold-hi); line-height: 1.1; text-wrap: balance; }
.en { font-family: var(--display); letter-spacing: .2em; font-size: 13px; color: var(--cyan); text-transform: uppercase; margin-top: -6px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); color: var(--gold); }
.tag.region { color: var(--rc, var(--gold)); border-color: var(--rc, var(--line)); }
.desc { margin: 0; max-width: 34ch; font-size: 15px; line-height: 1.65; color: var(--text); text-wrap: pretty; min-height: 3.3em; }
.counter { font-size: 12px; color: var(--muted); }

.go {
  font: 700 17px var(--body); letter-spacing: .08em; color: #1a1408; cursor: pointer;
  background: linear-gradient(180deg, #e6c98a, var(--gold) 55%, #a88a4e);
  border: 0; padding: 14px 44px; width: min(100%, 320px); min-height: 52px;
  clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
  transition: filter .15s, transform .1s;
}
.go:hover { filter: brightness(1.08); }
.go:active { transform: scale(.98); }
.go:disabled { filter: grayscale(.6) brightness(.8); cursor: progress; }

.history h2 { margin: 0 0 10px; font-family: var(--display); font-size: 12px; letter-spacing: .25em; color: var(--muted); text-transform: uppercase; font-weight: 600; text-align: center; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.hist li { width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.hist svg { width: 48px; height: 48px; }
.empty { color: var(--muted); font-size: 13px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .crest.spin svg, .crest.pop svg, .crest.pop img { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Summoner's Rift</div>
    <h1>랜덤 챔피언 뽑기</h1>

    <p class="empty" id="histEmpty">아직 뽑은 챔피언이 없습니다.</p>
  </section>
</div>

Yone|요네|전사|이오니아|영혼 검사입니다. 영혼을 베고 두 몸을 오가며 싸웁니다.
Yorick|요릭|전사|그림자 군도|묘지기입니다. 망령과 거대한 삽으로 적을 밀어냅니다.
Yunara|유나라|원거리 딜러|이오니아|이오니아의 영적인 힘을 다루는 원거리 챔피언입니다.
Yuumi|유미|서포터|요들|마법 고양이입니다. 아군에게 붙어 치유와 보호를 제공합니다.
Zaahen|자헨|전사|슈리마|다르킨의 힘을 지닌 근접 전사입니다.
Zac|자크|탱커|자운|슬라임 괴물입니다. 몸을 늘려 적을 끌어당기고 튀어 오릅니다.
Zed|제드|암살자|이오니아|그림자의 대가입니다. 그림자 분신으로 적을 베고 표식으로 처치합니다.
Zeri|제리|원거리 딜러|자운|전기 소녀입니다. 빠르게 달리며 충전된 번개 사격을 합니다.
Ziggs|직스|마법사|요들|폭탄 요들입니다. 거대한 폭탄과 폭발 지형으로 포탑을 부숩니다.
Zilean|질리언|서포터|룬테라|시간의 마법사입니다. 폭탄으로 적을 느리게 하고 아군에 가속과 부활을 줍니다.
Zoe|조이|마법사|타곤|별의 장난꾸러기입니다. 별똥별과 수면 거품으로 놀라게 합니다.
Zyra|자이라|마법사|이쉬탈|가시 덩굴 마녀입니다. 식물 소환으로 영역을 장악합니다.`;

const CHAMPS = RAW.trim().split("\n").map(l => {
  const [en, ko, cls, region, desc] = l.split("|");
  return { en, ko, cls, region, desc };
});

const REGION_COLOR = {
  "데마시아": "#d9c48a", "녹서스": "#c4453d", "프렐요드": "#6fc0e6", "이오니아": "#e08fc0",
  "자운": "#3fcf93", "필트오버": "#e0aa4a", "슈리마": "#e8b73c", "공허": "#9a63e0",
  "그림자 군도": "#3fb59b", "빌지워터": "#e5793c", "요들": "#7f95ee", "타곤": "#ee7fa3",
  "이쉬탈": "#58bd62", "룬테라": "#92a8c2", "카마보르": "#c27040"
};
const CLASSES = ["전체", "전사", "마법사", "암살자", "탱커", "원거리 딜러", "서포터"];

const $ = id => document.getElementById(id);
let filter = "전체", busy = false, history = [];
try { history = JSON.parse(localStorage.getItem("lolHist") || "[]").filter(n => CHAMPS.some(c => c.en === n)); } catch (e) {}

function initials(en) {
  const w = en.replace(/[^A-Za-z' &.]/g, "").split(/[ &.]+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase().replace("'", "");
}
function crest(c) {
  const col = REGION_COLOR[c.region] || "#c8aa6e";
  const id = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${c.en} 문장">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${col}" stop-opacity=".95"/><stop offset="1" stop-color="#07111f"/>
      </linearGradient>
      <radialGradient id="${id}r" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <polygon points="100,6 182,53 182,147 100,194 18,147 18,53" fill="url(#${id})" stroke="#c8aa6e" stroke-width="4"/>
    <polygon points="100,22 168,61 168,139 100,178 32,139 32,61" fill="#06101d" fill-opacity=".72" stroke="${col}" stroke-width="2"/>
    <polygon points="100,22 168,61 168,139 100,178 32,139 32,61" fill="url(#${id}r)"/>
    <text x="100" y="122" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="800" font-size="${initials(c.en).length > 1 ? 66 : 82}" fill="#f0e6d2" letter-spacing="2">${initials(c.en)}</text>
    <path d="M62 150 H138" stroke="${col}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

const DD_ID = { "Wukong":"MonkeyKing","Nunu & Willump":"Nunu","Kha'Zix":"Khazix","Cho'Gath":"Chogath","Kai'Sa":"Kaisa","Kog'Maw":"KogMaw","Vel'Koz":"Velkoz","Rek'Sai":"RekSai","Bel'Veth":"Belveth","K'Sante":"KSante","LeBlanc":"Leblanc","Renata Glasc":"Renata" };
function ddId(c) { return DD_ID[c.en] || c.en.replace(/[^A-Za-z]/g, ""); }
function artUrl(c) { return "https://ddragon.leagueoflegends.com/cdn/img/champion/splash/" + ddId(c) + "_0.jpg"; }

function pool() { return CHAMPS.filter(c => filter === "전체" || c.cls === filter); }
function updateCounter() { $("counter").textContent = `${filter === "전체" ? "전체" : filter} ${pool().length}명 중에서 뽑습니다`; }

function show(c, anim, withArt) {
  const el = $("crest");
  if (withArt) {
    el.className = "crest wide" + (anim ? " " + anim : "");
    el.innerHTML = "";
    const img = new Image();
    img.alt = c.en + " 일러스트";
    img.referrerPolicy = "no-referrer";
    img.onerror = () => { el.className = "crest" + (anim ? " " + anim : ""); el.innerHTML = crest(c); };
    img.src = artUrl(c);
    el.append(img);
  } else {
    el.className = "crest" + (anim ? " " + anim : "");
    el.innerHTML = crest(c);
  }
  $("name").textContent = c.ko;
  $("en").textContent = c.en;
}
function showDetails(c) {
  $("tags").innerHTML = "";
  const t1 = document.createElement("span"); t1.className = "tag"; t1.textContent = c.cls;
  const t2 = document.createElement("span"); t2.className = "tag region"; t2.textContent = c.region;
  t2.style.setProperty("--rc", REGION_COLOR[c.region] || "#c8aa6e");
  $("tags").append(t1, t2);
  $("desc").textContent = c.desc;
}

function renderHistory() {
  const ul = $("hist"); ul.innerHTML = "";
  history.slice(0, 8).forEach(n => {
    const c = CHAMPS.find(x => x.en === n); if (!c) return;
    const li = document.createElement("li");
    li.innerHTML = crest(c) + `<span></span>`;
    li.lastChild.textContent = c.ko;
    ul.append(li);
  });
  $("histEmpty").hidden = history.length > 0;
}

function roll() {
  if (busy) return;
  const list = pool(); if (!list.length) return;
  busy = true; $("go").disabled = true;
  const final = list[Math.floor(Math.random() * list.length)];
  $("desc").textContent = "…"; $("tags").innerHTML = "";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let steps = reduce ? 1 : 16, i = 0, delay = 60;
  (function tick() {
    if (i < steps) {
      show(list[Math.floor(Math.random() * list.length)], "spin");
      i++; delay += 9; setTimeout(tick, delay);
    } else {
      show(final, "pop", true); showDetails(final);
      history = [final.en, ...history.filter(n => n !== final.en)].slice(0, 8);
      try { localStorage.setItem("lolHist", JSON.stringify(history)); } catch (e) {}
      renderHistory();
      busy = false; $("go").disabled = false; $("go").textContent = "다시 뽑기";
    }
  })();
}

CLASSES.forEach(c => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === filter);
  b.addEventListener("click", () => {
    filter = c;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
    updateCounter();
  });
  $("filters").append(b);
});
$("go").addEventListener("click", roll);
$("crest").innerHTML = crest({ en: "?", region: "룬테라" }).replace(/>\?</, ">?<");
updateCounter(); renderHistory();
document.querySelector(".sub").textContent = `전체 ${CHAMPS.length}명의 챔피언 중 한 명을 뽑아 보세요.`;
</script>
